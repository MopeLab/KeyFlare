name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: win-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Publish framework-dependent application
        run: dotnet publish KeyFlare.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o "${{ runner.temp }}/publish"

      - name: Upload publish directory
        uses: actions/upload-artifact@v7
        with:
          name: KeyFlare-${{ matrix.rid }}
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error

  container:
    name: Build and publish container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/mopelab/keyflare

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build container
        run: docker build --platform linux/amd64 --tag "$IMAGE:$GITHUB_SHA" .

      - name: Verify container startup and SQLite volume
        run: |
          docker run --detach --name keyflare-ci --publish 127.0.0.1:18080:8080 \
            --mount source=keyflare-ci,target=/app/App_Data "$IMAGE:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18080/admin/login --output /dev/null
          docker exec keyflare-ci test -s /app/App_Data/keyflare.db

      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
